apiVersion: apps/v1
kind: Deployment
metadata:
  name: sea-lion-ui-deploy
  namespace: _namespace
spec:
  selector:
    matchLabels:
      app: sea-lion-ui
  replicas: 1
  template:
    metadata:
      labels:
        app: sea-lion-ui
    spec:
      nodeSelector:
        workfor: biz
      containers:
        - name: sea-lion-ui
          image: 10.1.32.6:28080/openaide/sea-lion-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 500Mi
            limits:
              cpu: 1
              memory: 1000Mi
          env:
            - name: env
              value: 'dev'
      imagePullSecrets:
        - name: harbor-registry-key
---
apiVersion: v1
kind: Service
metadata:
  name: sea-lion-ui-service
  namespace: _namespace
spec:
  type: ClusterIP
  selector:
    app: sea-lion-ui
  ports:
    - protocol: TCP
      port: 8090
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sea-lion-ui-ingress
  namespace: _namespace
  annotations:
    kubernetes.io/ingress.class: 'nginx'
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  tls:
    - hosts:
        - dev.openxlab.org.cn
      secretName: dev.openxlab.org.cn-https
  rules:
    - host: dev.openxlab.org.cn
      http:
        paths:
          - backend:
              service:
                name: sea-lion-ui-service
                port:
                  number: 8090
            pathType: Prefix
            path: /sealion(/|$)(.*)

